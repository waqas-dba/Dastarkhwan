name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 10.0.x
  POSTGRES_USER: dastarkhwan
  POSTGRES_PASSWORD: dastarkhwan_dev_only
  POSTGRES_DB: dastarkhwan_test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Dastarkhwan.slnx

      - name: Build
        run: dotnet build Dastarkhwan.slnx --no-restore

      - name: Run Identity tests
        run: dotnet test CoreKit.Identity.Tests/CoreKit.Identity.Tests.csproj --no-build --verbosity normal
        env:
          ConnectionStrings__Identity: Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}

      - name: Run Access tests
        run: dotnet test CoreKit.Access.Tests/CoreKit.Access.Tests.csproj --no-build --verbosity normal
        env:
          ConnectionStrings__Access: Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}

      - name: Run Tenant tests
        run: dotnet test CoreKit.Tenant.Tests/CoreKit.Tenant.Tests.csproj --no-build --verbosity normal
        env:
          ConnectionStrings__Tenant: Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}

  composed-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Admin host
        run: dotnet build Dastarkhwan.Admin/Dastarkhwan.Admin.csproj

      - name: Run composed smoke test (Identity + Tenant + Access)
        run: |
          dotnet test Dastarkhwan.Integration.Tests/Dastarkhwan.Integration.Tests.csproj \
            --no-build \
            --filter "FullyQualifiedName~ComposedSmokeTest" \
            --verbosity normal
        env:
          ConnectionStrings__Identity: Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}
          ConnectionStrings__Access: Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}
          ConnectionStrings__Tenant: Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}
          Identity__Jwt__SigningKey: this-is-a-dev-only-signing-key-that-is-at-least-32-bytes-long
          Identity__Jwt__Issuer: https://localhost:5000
          Identity__Jwt__Audience: dastarkhwan
          Identity__Lockout__Threshold: 5
          Identity__Lockout__DurationMinutes: 15
          Access__CacheSeconds: 30
